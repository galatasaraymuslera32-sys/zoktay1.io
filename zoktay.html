
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ Zeynep Sude Oktay ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #ffe0ef, #ffb6d5, #fff0f7);
    color: #ff2585;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

header {
    padding: 70px 15px 45px;
}

.heart {
    font-size: 40px;
    animation: kalp 1s infinite alternate;
}

h1 {
    font-size: clamp(42px, 10vw, 110px);
    font-weight: 1000;
    line-height: 1.1;
    text-shadow: 4px 4px 0 white,
                 7px 7px 0 #ff8fbe;
    overflow-wrap: anywhere;
}

.subtitle {
    color: #b72b70;
    font-size: 20px;
    margin-top: 25px;
}

.button {
    display: inline-block;
    margin-top: 28px;
    padding: 15px 30px;
    background: #ff3e93;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 5px 15px #ff91bd;
}

section {
    padding: 35px 20px 60px;
}

h2 {
    font-size: 35px;
    margin-bottom: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    max-width: 1000px;
    margin: auto;
}

.photo {
    background: white;
    padding: 12px 12px 22px;
    border-radius: 18px;
    box-shadow: 0 8px 20px #e97eae55;
    transform: rotate(-2deg);
    transition: 0.3s;
}

.photo:nth-child(even) {
    transform: rotate(2deg);
}

.photo:hover {
    transform: scale(1.05) rotate(0);
}

.photo img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 12px;
}

.photo p {
    margin-top: 14px;
    font-size: 20px;
    font-weight: bold;
}

.message {
    background: #ffffffb8;
    padding: 35px 20px;
    margin: 20px auto 60px;
    max-width: 750px;
    border-radius: 25px;
    font-size: 23px;
    line-height: 1.7;
}

footer {
    background: #ff78b2;
    color: white;
    padding: 25px;
    font-size: 17px;
}

@keyframes kalp {
    from { transform: scale(1); }
    to { transform: scale(1.25); }
}
</style>
</head>

<body>

<header>
    <div class="heart">♡ 💗 ♡</div>

    <h1>ZEYNEP<br>SUDE<br>OKTAY</h1>

    <p class="subtitle">
        ✨ Bu sitenin başrolü sensin ✨
    </p>

    <a href="#fotograflar" class="button">
        FOTOĞRAFLARA BAK 💕
    </a>
</header>

<section id="fotograflar">
    <h2>🎀 ZOKTAY'IN DÜNYASI 🎀</h2>

    <div class="gallery">

        <div class="photo">
            <!-- Buraya ilk fotoğrafını ekle -->
            <img src="zoktay1.jpg" alt="Zoktay fotoğrafı">
            <p>💗 Pretty girl 💗</p>
        </div>

        <div class="photo">
            <img src="zoktay2.jpg" alt="Zoktay fotoğrafı">
            <p>🎀 It's her world 🎀</p>
        </div>

        <div class="photo">
            <img src="zoktay3.jpg" alt="Zoktay fotoğrafı">
            <p>🩷 Main character 🩷</p>
        </div>

    </div>
</section>

<div class="message">
    💌<br>
    <strong>ZEYNEP SUDE OKTAY</strong><br>
    Bir isim, bin güzellik. 🎀<br>
    Bu sayfanın yıldızı sensin! 💗
</div>

<footer>
    ♡ ZOKTAY FAN CLUB ♡<br>
    Made with love 💕
</footer>

</body>
</html>
